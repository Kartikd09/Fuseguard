# gitleaks config — secret scanning for FuseGuard
title = "FuseGuard gitleaks config"

[extend]
# Start from gitleaks' built-in rule set
useDefault = true

[allowlist]
description = "Allowlisted paths and placeholders"
paths = [
  '''\.env\.example$''',
  '''README\.md$''',
  '''docs/.*\.md$''',
]
# Placeholder values that are intentionally present
regexes = [
  '''your-anon-key''',
  '''server-only-never-expose''',
  '''your-project\.supabase\.co''',
]
