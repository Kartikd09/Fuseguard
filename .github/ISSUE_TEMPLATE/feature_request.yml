name: Feature Request
description: Suggest a feature for FuseGuard
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who has it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: tier
    attributes:
      label: Relevant tier
      options:
        - Open-source core
        - Hosted / paid
        - Both
