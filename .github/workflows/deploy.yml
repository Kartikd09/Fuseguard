name: Deploy (production)

# CD: merge to main → build + deploy the Worker proxy and the dashboard to Cloudflare.
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Worker proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck + test core
        run: |
          npm run typecheck --if-present
          npx vitest run
      - name: Deploy to Cloudflare (production)
        working-directory: packages/core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

  deploy-dashboard:
    name: Deploy dashboard (CF Workers via OpenNext)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hosted/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (workspace root)
        working-directory: .
        run: npm ci
      - name: Build for Cloudflare Workers (OpenNext)
        run: npm run build:cf
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
