name: Deploy (production)

# CD: merge to main → build + deploy the Worker proxy and the dashboard to Cloudflare.
# Requires repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Deploy Worker proxy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck + test core
        run: |
          npm run typecheck --if-present
          npx vitest run
      - name: Deploy to Cloudflare (production)
        working-directory: packages/core
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production

  deploy-dashboard:
    name: Deploy dashboard (CF Workers via OpenNext)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hosted/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install (workspace root)
        working-directory: .
        run: npm ci
      - name: Build + deploy to Cloudflare Workers (OpenNext)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # NEXT_PUBLIC_* are baked into the client bundle at build time — they MUST be
          # present here or the dashboard ships with placeholder Supabase config and login
          # silently fails. The anon key is public-by-design (RLS enforces access).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Non-interactive: never prompt for telemetry/error reporting in CI.
          CI: "true"
          WRANGLER_SEND_METRICS: "false"
        # opennextjs-cloudflare deploy runs the OpenNext build then wrangler deploy
        # via the local bin — avoids the `npx wrangler` executable-resolution failure.
        run: npm run deploy:cf
